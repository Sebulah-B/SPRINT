<!doctype html>
<html>
  <head>
    <title>XML Generator</title>
    <style>
      textarea { width: 100%; height: 150px; }
      pre { background: #f5f5f5; padding: 1em; white-space: pre-wrap; }
      .error { color: red; }
      .info { font-size: 0.9em; color: #555; }
      label, input, button { display: block; margin-top: 10px; }
    </style>
  </head>
  <body>
    <h1>XML Generator</h1>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <form action="/generate" method="post">
      <label for="excerpt">Enter your excerpt:</label>
      <textarea name="excerpt" id="excerpt">{{ request.form.excerpt or "" }}</textarea>

      <label for="model_select">Select Model Source:</label>
      <select name="model_select" id="model_select">
        <option value="base" {% if model_source == "base" %}selected{% endif %}>Base</option>
        <option value="local" {% if model_source == "local" %}selected{% endif %}>Local</option>
        <option value="hf" {% if model_source == "hf" %}selected{% endif %}>HuggingFace</option>
      </select>

      <button type="submit">Generate XML</button>
    </form>

    <h2>Generated XML:</h2>
    <pre>{{ xml or "Not Found" }}</pre>

    {% if xml %}
    <form action="/download" method="POST">
      <input type="hidden" name="xml_data" value="{{ xml|e }}">
      <label for="format">Download format:</label>
      <select name="format" id="format">
        <option value="docx">Word (.docx)</option>
        <option value="pdf">PDF (.pdf)</option>
      </select>
      <button type="submit">Download</button>
    </form>
    {% endif %}

    {% if raw %}
      <button type="button" onclick="toggleVisibility('intermediateBox')">Toggle Intermediate Output</button>
      <div id="intermediateBox" style="display:none;">
        <h3>Intermediate Output</h3>
        <textarea readonly rows="10" style="width: 100%;">{{ raw }}</textarea>
      </div>
    {% endif %}

    {% if model_source %}
      <p><strong>Model source used:</strong> {{ model_source | capitalize }}</p>
    {% endif %}

    <script>
      function toggleVisibility(id) {
        var box = document.getElementById(id);
        box.style.display = (box.style.display === "none") ? "block" : "none";
      }
    </script>
  </body>
</html>
